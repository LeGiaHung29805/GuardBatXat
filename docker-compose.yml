version: '3.8'

services:
  postgres-db:
    image: postgis/postgis:15-3.4-alpine
    container_name: batxat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hieu040205}
      POSTGRES_DB: GuardBatXat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: batxat_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batxat_backend
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/GuardBatXat
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-hieu040205}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-DayLaMotKhoaBaoMatCucKyDaiVaPhucTapCuaHeThongCanhBaoThienTaiBatXat2026!@#}
      - AI_SERVICE_BASE_URL=http://python-api:5000
    restart: unless-stopped

  python-api:
    build:
      context: ../GuardBaXat/Spatial-Intelligence
      dockerfile: Dockerfile
    container_name: batxat_ai_api
    ports:
      - "5000:5000"
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ../GuardBaXat/Spatial-Intelligence/data:/app/data
      - ../GuardBaXat/Spatial-Intelligence/models:/app/models
    environment:
      - DB_HOST=postgres-db
      - DB_NAME=GuardBatXat
      - DB_USER=postgres
      - DB_PASS=${DB_PASSWORD:-hieu040205}
    command: python src/api_clients/module3_api/routing_nearest.py
    restart: unless-stopped

  python-scheduler:
    build:
      context: ../GuardBaXat/Spatial-Intelligence
      dockerfile: Dockerfile
    container_name: batxat_scheduler
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ../GuardBaXat/Spatial-Intelligence/data:/app/data
      - ../GuardBaXat/Spatial-Intelligence/models:/app/models
    environment:
      - DB_HOST=postgres-db
      - DB_NAME=GuardBatXat
      - DB_USER=postgres
      - DB_PASS=${DB_PASSWORD:-hieu040205}
    command: python main_scheduler.py
    restart: always

  frontend:
    build:
      context: ../BatXat-Client
      dockerfile: Dockerfile
    container_name: batxat_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - INTERNAL_API_URL=http://backend:8080
    restart: unless-stopped

volumes:
  postgres_data: