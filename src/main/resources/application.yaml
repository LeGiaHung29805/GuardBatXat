server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: GuardBatXat

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/GuardBatXat}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      database: 0

batxat:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 86400000
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    service:
      base-url: ${AI_SERVICE_BASE_URL:http://localhost:5000}
  demo:
    seed-enabled: ${BATXAT_DEMO_SEED_ENABLED:false}
    citizen-password: ${BATXAT_DEMO_CITIZEN_PASSWORD:}
    rescue-password: ${BATXAT_DEMO_RESCUE_PASSWORD:}
    commander-password: ${BATXAT_DEMO_COMMANDER_PASSWORD:}
    admin-password: ${BATXAT_DEMO_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: mappings,health,info
